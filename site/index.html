<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#134a32">
<title>Wishlist Groups</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Young+Serif&display=swap">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
/* Layout: one narrow column. A header banner, a dashboard of groups, and inside a group: tabs (My list / Everyone / Purchases / Manage). */
:root{
  --bg:#f4f8f3; --surface:#ffffff; --surface-2:#f2f7f1;
  --ink:#14261b; --muted:#546a5b; --line:#d5e3d7; --line-strong:#b0c7b5;
  --primary:#176a43; --on-primary:#ffffff; --primary-soft:#dff0e5;
  --berry:#b5222f; --berry-soft:#fae2e5;
  --gold:#c08a14; --gold-soft:#fbefc9;
  --good:#1c6b44; --good-soft:#dbefe2;
  --warn:#7c5206; --warn-soft:#fbefc9;
  --danger:#b3261e; --danger-soft:#fbe5e3;
  --banner:#134a32; --banner-ink:#ffffff; --banner-accent:#f3d676;
  --stripe-a:#c4222f; --stripe-b:#ffffff;
  --shadow:0 1px 2px rgba(20,38,27,.06),0 6px 18px rgba(20,38,27,.07);
  --m-0:#b5222f; --m-1:#1f5f8f; --m-2:#8a3a78; --m-3:#1c6b44; --m-4:#9a6a0a; --m-5:#0e7490; --m-6:#a1431f; --m-7:#4d5fa8;
  --f-display:"Young Serif",Georgia,"Times New Roman",serif;
  --f-body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0c1912; --surface:#14261c; --surface-2:#192e23;
    --ink:#e9f3ec; --muted:#9db4a5; --line:#29412f; --line-strong:#3d5a46;
    --primary:#6fd29b; --on-primary:#0b1f15; --primary-soft:#1b3a2a;
    --berry:#ff8d9a; --berry-soft:#3e1d25;
    --gold:#f0cd6a; --gold-soft:#3a3114;
    --good:#7fd6a4; --good-soft:#1a3626;
    --warn:#eac36e; --warn-soft:#3a3114;
    --danger:#f19a93; --danger-soft:#3a1f1d;
    --banner:#103a28; --banner-ink:#ffffff; --banner-accent:#f3d676;
    --stripe-a:#c4222f; --stripe-b:#f4f7f2;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.3);
    --m-0:#ff8d9a; --m-1:#7bbbe8; --m-2:#e49bd6; --m-3:#84d6a8; --m-4:#efc66a; --m-5:#6fd0e4; --m-6:#f2a37e; --m-7:#a9b6f0;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0c1912; --surface:#14261c; --surface-2:#192e23;
  --ink:#e9f3ec; --muted:#9db4a5; --line:#29412f; --line-strong:#3d5a46;
  --primary:#6fd29b; --on-primary:#0b1f15; --primary-soft:#1b3a2a;
  --berry:#ff8d9a; --berry-soft:#3e1d25;
  --gold:#f0cd6a; --gold-soft:#3a3114;
  --good:#7fd6a4; --good-soft:#1a3626;
  --warn:#eac36e; --warn-soft:#3a3114;
  --danger:#f19a93; --danger-soft:#3a1f1d;
  --banner:#103a28; --banner-ink:#ffffff; --banner-accent:#f3d676;
  --stripe-a:#c4222f; --stripe-b:#f4f7f2;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.3);
  --m-0:#ff8d9a; --m-1:#7bbbe8; --m-2:#e49bd6; --m-3:#84d6a8; --m-4:#efc66a; --m-5:#6fd0e4; --m-6:#f2a37e; --m-7:#a9b6f0;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background:var(--bg); color:var(--ink); font-family:var(--f-body); font-size:15px; line-height:1.5;
  padding-block:16px 40px;
  border-top:6px solid; border-image:repeating-linear-gradient(135deg,var(--stripe-a) 0 12px,var(--stripe-b) 12px 24px) 6;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
button,input,textarea{font:inherit;color:inherit}
.wrap{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{font-family:var(--f-display);font-weight:400;margin:0;text-wrap:balance;line-height:1.15}
p{margin:0}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px;border-radius:6px}

/* header */
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;background-color:var(--banner);color:var(--banner-ink);border-radius:16px;padding:16px 18px;background-image:radial-gradient(circle at 12% 30%,rgba(255,255,255,.2) 0 2px,transparent 3px),radial-gradient(circle at 38% 72%,rgba(255,255,255,.14) 0 1.5px,transparent 2.5px),radial-gradient(circle at 63% 24%,rgba(255,255,255,.18) 0 2px,transparent 3px),radial-gradient(circle at 88% 64%,rgba(255,255,255,.14) 0 1.5px,transparent 2.5px)}
.brand{display:flex;flex-direction:column;gap:2px;min-width:0}
.eyebrow{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
.brand h1{font-size:26px}
.top .eyebrow{color:var(--banner-accent)}
.top h1{color:var(--banner-ink)}
.page-head h2,.who-head h2,.hero h1{color:var(--primary)}
.top-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.countdown{font-size:13px;color:#ffffff;background:#c4222f;padding:5px 11px;border-radius:999px;font-weight:600;font-variant-numeric:tabular-nums}
.me-chip{display:flex;align-items:center;gap:8px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:4px 12px 4px 4px;cursor:pointer}
.me-chip:hover{border-color:var(--line-strong)}
.me-chip span.nm{font-weight:600;font-size:14px}

.avatar{display:inline-grid;place-items:center;border-radius:50%;font-family:var(--f-display);flex:none;
  background:color-mix(in srgb,var(--mc) 16%,var(--surface));color:var(--mc);border:1px solid color-mix(in srgb,var(--mc) 35%,var(--surface))}
.avatar.s-sm{width:30px;height:30px;font-size:15px}
.avatar.s-lg{width:52px;height:52px;font-size:24px}
.avatar.s-md{width:40px;height:40px;font-size:19px}

/* tabs */
.tabs{display:flex;gap:4px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:4px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:1 0 auto;white-space:nowrap;border:0;background:transparent;padding:9px 12px;border-radius:9px;cursor:pointer;font-weight:600;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:8px;min-width:0}
.tab[aria-selected="true"]{background:var(--primary);color:var(--on-primary);box-shadow:var(--shadow)}
.tab .badge{font-size:12px;font-weight:600;background:var(--primary-soft);color:var(--primary);padding:1px 8px;border-radius:999px;font-variant-numeric:tabular-nums}
.tab .badge.warn{background:var(--warn-soft);color:var(--warn)}

/* panels & cards */
.panel{display:flex;flex-direction:column;gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px}
.page-head{display:flex;flex-direction:column;gap:6px}
.page-head h2{font-size:28px}
.muted{color:var(--muted)}
.note{display:flex;gap:10px;align-items:flex-start;background:var(--primary-soft);color:var(--ink);border-radius:12px;padding:12px 14px;font-size:14px}
.note svg{flex:none;margin-top:2px;color:var(--primary)}
.note.warn{background:var(--warn-soft)}
.note.warn svg{color:var(--warn)}
.status-pill{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:3px 10px;border-radius:999px;width:fit-content}
.status-pill.draft{background:var(--warn-soft);color:var(--warn)}
.status-pill.live{background:var(--good-soft);color:var(--good)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:10px;border:1px solid var(--line-strong);background:var(--surface);padding:9px 16px;font-weight:600;cursor:pointer}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted);padding:7px 10px}
.btn.ghost:hover{color:var(--ink);background:var(--surface-2)}
.btn.danger{color:var(--danger)}
.btn[disabled]{opacity:.45;cursor:not-allowed;filter:none}
.btn.sm{padding:6px 11px;font-size:14px}

/* editor */
.items{display:flex;flex-direction:column;gap:12px}
.item{display:flex;flex-direction:column;gap:12px}
.item-head{display:flex;justify-content:space-between;align-items:center}
.item-head .lbl{font-size:12px;letter-spacing:.09em;text-transform:uppercase;font-weight:600;color:var(--muted)}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:13px;font-weight:600}
.field label .opt{font-weight:400;color:var(--muted)}
.field input,.field textarea{width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.field textarea{resize:vertical;min-height:68px}
.field input::placeholder,.field textarea::placeholder{color:var(--muted);opacity:.8}
.field input:focus,.field textarea:focus{outline:2px solid var(--primary);outline-offset:0;border-color:transparent;background:var(--surface)}
.field.bad input,.field.bad textarea{border-color:var(--danger)}
.err{color:var(--danger);font-size:13px}
.bar{position:sticky;bottom:0;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
  background:var(--surface);border:1px solid var(--line-strong);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow)}
.bar .count{font-weight:600;font-variant-numeric:tabular-nums}
.bar .count.bad{color:var(--danger)}
.bar .count.ok{color:var(--good)}
.meter{display:flex;gap:4px;margin-top:6px}
.meter i{width:26px;height:5px;border-radius:3px;background:var(--line)}
.meter i.on{background:var(--good)}

/* family grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.tag{position:relative;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:14px;cursor:pointer;min-width:0}
.tag::before{content:"";position:absolute;top:14px;right:14px;width:11px;height:11px;border-radius:50%;background:var(--bg);border:2px solid var(--gold)}
.tag:hover{border-color:var(--line-strong);box-shadow:var(--shadow)}
.tag[disabled]{cursor:default;box-shadow:none;border-style:dashed}
.tag .who{display:flex;align-items:center;gap:12px}
.tag .who h3{font-size:20px}
.tag .meta{font-size:14px;color:var(--muted)}
.progress{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.progress b{display:block;height:100%;background:var(--good);border-radius:3px}
.prog-row{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;margin-bottom:6px}

/* member list */
.who-head{display:flex;align-items:center;gap:14px}
.who-head h2{font-size:28px}
.wish{display:flex;gap:14px;align-items:flex-start;justify-content:space-between}
.wish-main{display:flex;flex-direction:column;gap:6px;min-width:0;flex:1}
.wish h3{font-size:18px;overflow-wrap:anywhere}
.wish p.desc{color:var(--muted);overflow-wrap:anywhere;white-space:pre-wrap}
.wish p.price{font-size:15px;font-variant-numeric:tabular-nums}
.wish a.link{display:inline-flex;align-items:center;gap:6px;color:var(--primary);font-weight:600;font-size:14px;text-decoration:none;width:fit-content;max-width:100%;overflow-wrap:anywhere}
.wish a.link:hover{text-decoration:underline}
.wish-side{display:flex;flex-direction:column;align-items:flex-end;gap:8px;flex:none}
.wish.bought{background:var(--surface-2)}
.wish.bought h3{color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:4px 11px;border-radius:999px;background:var(--good-soft);color:var(--good);white-space:nowrap}
.buy{display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--line-strong);background:var(--surface);border-radius:10px;padding:8px 12px;cursor:pointer;font-weight:600;white-space:nowrap}
.buy:hover{border-color:var(--good);color:var(--good)}
.buy .box{width:18px;height:18px;border-radius:5px;border:1.5px solid var(--line-strong);display:grid;place-items:center}
.buy.mine{border-color:var(--good);background:var(--good-soft);color:var(--good)}
.buy.mine .box{background:var(--good);border-color:var(--good);color:var(--surface)}
.buylist{list-style:none;margin:12px 0 6px;padding:0;display:flex;flex-direction:column}
.buyrow{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-top:1px solid var(--line)}
.buyrow:first-child{border-top:0}
.buyrow .bn{min-width:0;overflow-wrap:anywhere;font-weight:500}
.buyrow .bp{white-space:nowrap;font-variant-numeric:tabular-nums;text-align:right}
.back{align-self:flex-start}
@media (max-width:520px){.tab{padding:9px 6px;font-size:14px;gap:5px}.tab .badge{padding:1px 6px}}
.empty{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.empty h3{font-size:20px}

/* picker / gate */
.hero{display:flex;flex-direction:column;gap:10px;padding-block:8px}
.hero h1{font-size:34px}
.hero p{max-width:56ch;color:var(--muted)}
.pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.pick .tag{align-items:flex-start;padding:16px;gap:10px}
.pick .tag h3{font-size:20px}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:14px}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(88px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);
  padding:10px 16px;border-radius:10px;font-weight:600;font-size:14px;box-shadow:var(--shadow);max-width:calc(100% - 32px);z-index:20}
.skeleton{height:84px;border-radius:14px;background:linear-gradient(90deg,var(--surface-2),var(--surface),var(--surface-2));background-size:200% 100%;animation:sh 1.4s linear infinite}
@keyframes sh{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){.skeleton{animation:none}}
@media (max-width:520px){
  .wish{flex-direction:column}
  .wish-side{align-items:flex-start;flex-direction:row;flex-wrap:wrap}
  .hero h1{font-size:28px}
}

/* groups dashboard, forms, invite */
.dash-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.gcard{align-items:stretch;gap:12px}
.gcard h3{font-size:21px;overflow-wrap:anywhere;padding-right:22px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--primary-soft);color:var(--primary);white-space:nowrap}
.chip.gold{background:var(--gold-soft);color:var(--warn)}
.chip.grey{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.chip.red{background:var(--berry-soft);color:var(--berry)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;margin:0}
.stats div{display:flex;flex-direction:column;gap:1px;min-width:0}
.stats dt{font-size:12px;color:var(--muted);letter-spacing:.02em}
.stats dd{margin:0;font-weight:600;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.row2{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:start}
.qty{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.qty input[type=number]{width:92px}
.qty .chk{display:inline-flex;align-items:center;gap:6px;font-weight:500;font-size:14px;cursor:pointer}
.qty .chk input{width:auto;accent-color:var(--primary)}
.field input[type=date]{min-height:44px}
.linkbox{display:flex;gap:8px;flex-wrap:wrap}
.linkbox input{flex:1;min-width:200px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.wanted{font-size:13px;color:var(--muted)}
.wanted b{color:var(--ink)}
.also{font-size:13px;color:var(--muted);max-width:240px;text-align:right}
.person{display:flex;align-items:center;flex-wrap:wrap;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.person .confirm{flex-basis:100%}
.field input:disabled{opacity:.55;cursor:not-allowed}
.person:first-child{border-top:0}
.person .pn{flex:1;min-width:0;overflow-wrap:anywhere;font-weight:500}
.stack{display:flex;flex-direction:column;gap:10px}
@media (max-width:520px){
  .row2{grid-template-columns:1fr}
  .also{text-align:left;max-width:none}
}
.buy[disabled]{opacity:.5;cursor:not-allowed}
.buy[disabled]:hover{border-color:var(--line-strong);color:inherit}
.buy.mine[disabled]:hover{border-color:var(--good);color:var(--good)}
.linkbox input[disabled]{opacity:.55;cursor:not-allowed}
.gcard.archived{background:var(--surface-2)}
.gcard.archived h3{color:var(--muted)}
.paid{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);white-space:nowrap}
.paid input{width:96px;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:6px 8px;text-align:right;font-variant-numeric:tabular-nums}
.paid input:focus{outline:2px solid var(--primary);outline-offset:0;background:var(--surface)}
.paid input[disabled]{opacity:.55;cursor:not-allowed}
.total{font-family:var(--f-display);font-size:32px;color:var(--primary);font-variant-numeric:tabular-nums;line-height:1.1}
.list-total{font-family:var(--f-display);font-size:20px;color:var(--primary);font-variant-numeric:tabular-nums;white-space:nowrap}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<noscript>This site needs JavaScript turned on.</noscript>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
